name: CI Pipeline - PluriOne Autoservicio RH

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hr_autoservice_db
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_password_secure_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar Pruebas Automatizadas (55 tests)
        env:
          SECRET_KEY: django-insecure-ci-test-key-plurione-2026
          DEBUG: 'False'
          USE_POSTGRES: 'True'
          POSTGRES_DB: hr_autoservice_db
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_password_secure_2026
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          GEMINI_API_KEY: ''
        working-directory: ./backend
        run: |
          python manage.py test --noinput

  frontend-test:
    name: Frontend Build & Unit Tests (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar Dependencias Frontend
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Ejecutar Pruebas Unitarias de Frontend
        working-directory: ./frontend
        run: npm test

      - name: Compilar Bundle para Producción
        working-directory: ./frontend
        run: npm run build
